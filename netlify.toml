# Netlify production configuration for PrecoCerto.
# The repository contains multiple roots; this pins the Netlify site to the app.

[build]
base = "precocerto"
command = "npm install --force --legacy-peer-deps && npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "20"
VITE_DEPLOY_TARGET = "netlify"

# ============================================================
# FIREBASE CONFIGURATION (OBRIGATÓRIO)
# ============================================================
# Estas variáveis devem ser configuradas no Netlify UI:
# Site Settings → Build & Deploy → Environment → Edit variables
#
# Valores a obter em:
# https://console.firebase.google.com/
# Projeto: precocerto-cc04a
# Configurações do Projeto → Apps → Web App
#
# NUNCA committar valores reais. Deixar vazias aqui.
# Configurar apenas no Netlify UI como variáveis de environment.

# VITE_FIREBASE_API_KEY = "" # (Obrigatório) - API Key do Firebase
# VITE_FIREBASE_AUTH_DOMAIN = "" # (Obrigatório) - Ex: precocerto-cc04a.firebaseapp.com
# VITE_FIREBASE_PROJECT_ID = "" # (Obrigatório) - Ex: precocerto-cc04a
# VITE_FIREBASE_STORAGE_BUCKET = "" # (Obrigatório) - Ex: precocerto-cc04a.appspot.com
# VITE_FIREBASE_MESSAGING_SENDER_ID = "" # (Obrigatório) - Sender ID do Firebase
# VITE_FIREBASE_APP_ID = "" # (Obrigatório) - App ID do Firebase
# VITE_FIREBASE_MEASUREMENT_ID = "" # (Opcional) - Analytics ID do Firebase
VITE_APP_ENV = "production"

# ============================================================
# SECRET SCANNING CONFIGURATION
# ============================================================
# Firebase browser config é intencionalmente público em apps cliente.
# Manter secret scanning ativado, mas não bloquear deploys para config pública.

SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_MEASUREMENT_ID,FIREBASE_API_KEY,FIREBASE_AUTH_DOMAIN,FIREBASE_PROJECT_ID,FIREBASE_STORAGE_BUCKET,FIREBASE_MESSAGING_SENDER_ID,FIREBASE_APP_ID,FIREBASE_MEASUREMENT_ID"
SECRETS_SCAN_OMIT_PATHS = "precocerto/src/firebase.ts,precocerto/firebase-applet-config.json,precocerto/dist/**"

# Deploy log apenas expõe "Segredos expostos detectados"; sem valores exatos.
# Manter secret scanning normal, mas desativar smart detection para static app.
SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"
