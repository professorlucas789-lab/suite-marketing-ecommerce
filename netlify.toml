# Netlify production configuration for PrecoCerto.
# The repository contains multiple roots; this pins the Netlify site to the app.

[build]
base = "precocerto"
command = "npm install --force --legacy-peer-deps && npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "20"
VITE_DEPLOY_TARGET = "netlify"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"
