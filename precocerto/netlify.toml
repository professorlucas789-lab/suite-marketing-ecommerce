# Netlify Configuration for PreçoCerto
# This file configures the build and deployment for Netlify

[build]
# Build command - installs dependencies and builds the Vite project
command = "npm install --force --legacy-peer-deps && npm run build"
# Output directory where the built files are located
publish = "dist"

[build.environment]
# Secrets scanning: safelist the PUBLIC Firebase Web API key.
#
# Firebase Web client config (including the API key) is public by design — the
# browser SDK transmits it on every request, so it is an identifier, not a
# credential. Access control lives in firestore.rules + Firebase Auth. Netlify's
# smart detection matches its "AIza..." shape and fails the build, so the exact
# value is safelisted here.
#
# Only this single value is exempted: smart detection stays enabled for every
# other pattern, and standard scanning of environment variables marked as secrets
# (e.g. GEMINI_API_KEY) is untouched. Never add a real server-side secret here.
SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyC0VIZYQvNPbwWb4QrX33OV0yL180HA-08"

[dev]
# Development command for local testing
command = "npm run dev"
port = 3000

# Rewrite rules for Single Page Application (SPA)
# All routes fall back to index.html for client-side routing
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Cache control for assets
# Static assets with hashes in filenames are cached long-term
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Cache control for HTML and dynamic content
[[headers]]
for = "/*.html"
[headers.values]
Cache-Control = "public, max-age=3600, must-revalidate"
