name: 🚀 Deploy para Firebase Staging

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Escolha: validate-auth para validar credenciais, deploy-rules para publicar Firestore Rules, smoke-rules para executar smoke tests, ou deploy para deploy Hosting completo'
        required: true
        default: 'validate-auth'
        type: choice
        options:
          - validate-auth
          - deploy-rules
          - smoke-rules
          - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging

    permissions:
      contents: read

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 🔐 Validar e normalizar Project ID (Staging)
        id: firebase-config
        run: |
          # Obter Project ID do GitHub Environment
          PROJECT_ID_RAW="${{ vars.FIREBASE_PROJECT_ID }}"
          echo "🔍 Project ID recebido do GitHub"

          # Normalizar: lowercase + remover whitespace (início/fim/tabs)
          PROJECT_ID_NORMALIZED=$(printf '%s' "$PROJECT_ID_RAW" | tr '[:upper:]' '[:lower:]' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          echo "🔤 Project ID normalizado: $PROJECT_ID_NORMALIZED"

          # Validação obrigatória: deve ser staging, NUNCA produção
          if [ "$PROJECT_ID_NORMALIZED" = "precocerto-cc04a" ]; then
            echo "❌ BLOQUEADO: Detectado Project ID de PRODUÇÃO!"
            echo "Esta workflow só pode usar staging (precocerto-staging)."
            exit 1
          fi

          # Validação obrigatória: confirmar que é staging
          if [ "$PROJECT_ID_NORMALIZED" != "precocerto-staging" ]; then
            echo "❌ BLOQUEADO: Project ID inválido para staging!"
            echo "Esperado: precocerto-staging"
            echo "Recebido: $PROJECT_ID_NORMALIZED"
            exit 1
          fi

          echo "✅ Project ID validado: $PROJECT_ID_NORMALIZED"
          echo "project_id=$PROJECT_ID_NORMALIZED" >> $GITHUB_OUTPUT
          echo "PROJECT_ID_NORMALIZED=$PROJECT_ID_NORMALIZED" >> $GITHUB_ENV

      - name: 🔐 Autenticar no Google Cloud (Firebase Service Account)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}

      - name: ☁️ Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🔥 Deploy Firestore Rules — STAGING (deploy-rules)
        if: ${{ github.event.inputs.operation == 'deploy-rules' }}
        run: |
          echo "🔥 Deploy de Firestore Rules para STAGING..."
          echo ""

          # Validação crítica: SOMENTE staging autorizado
          if [ "${{ env.PROJECT_ID_NORMALIZED }}" != "precocerto-staging" ]; then
            echo "❌ BLOQUEADO: Project ID inválido para deploy-rules!"
            echo "   Esperado: precocerto-staging"
            echo "   Recebido: ${{ env.PROJECT_ID_NORMALIZED }}"
            exit 1
          fi

          echo "✅ Project ID validado: ${{ env.PROJECT_ID_NORMALIZED }}"
          echo "🔑 Secret: FIREBASE_SERVICE_ACCOUNT_STAGING"
          echo ""

          # Deploy SOMENTE das Firestore Rules
          echo "📦 Publicando Firestore Rules de precocerto/firestore.rules..."
          npx firebase-tools deploy \
            --only firestore:rules \
            --project "${{ env.PROJECT_ID_NORMALIZED }}" \
            --non-interactive

          if [ $? -eq 0 ]; then
            echo ""
            echo "✅ Firestore Rules publicadas com sucesso em precocerto-staging!"
            echo "📍 Projeto: ${{ env.PROJECT_ID_NORMALIZED }}"
            echo "🔒 Protegido: Nenhum index, Hosting ou Functions publicados"
          else
            echo ""
            echo "❌ Erro ao publicar Firestore Rules!"
            exit 1
          fi

      - name: 🔍 Validar Identidade do Service Account (validate-auth)
        if: ${{ github.event.inputs.operation == 'validate-auth' }}
        run: |
          echo "🔐 Validando identidade do service account ativo..."
          ACTIVE_ACCOUNT=$(gcloud auth list --filter=status:ACTIVE --format="value(account)")
          echo "👤 Conta ativa: $ACTIVE_ACCOUNT"

          EXPECTED_ACCOUNT="github-actions-staging@precocerto-staging.iam.gserviceaccount.com"
          if [ "$ACTIVE_ACCOUNT" != "$EXPECTED_ACCOUNT" ]; then
            echo "❌ BLOQUEADO: Identidade do service account não corresponde!"
            echo "   Esperado: $EXPECTED_ACCOUNT"
            echo "   Recebido: $ACTIVE_ACCOUNT"
            exit 1
          fi
          echo "✅ Identidade validada: $EXPECTED_ACCOUNT"

      - name: 🎯 Validar Projeto no gcloud (validate-auth)
        if: ${{ github.event.inputs.operation == 'validate-auth' }}
        run: |
          echo "🔍 Configurando e validando projeto..."
          gcloud config set project "${{ env.PROJECT_ID_NORMALIZED }}"

          ACTIVE_PROJECT=$(gcloud config get-value project)
          echo "📊 Projeto ativo: $ACTIVE_PROJECT"

          if [ "$ACTIVE_PROJECT" != "${{ env.PROJECT_ID_NORMALIZED }}" ]; then
            echo "❌ BLOQUEADO: Projeto ativo não corresponde!"
            echo "   Esperado: ${{ env.PROJECT_ID_NORMALIZED }}"
            echo "   Recebido: $ACTIVE_PROJECT"
            exit 1
          fi
          echo "✅ Projeto validado: $ACTIVE_PROJECT"

      - name: 🧪 Teste Read-Only de Acesso Firebase (validate-auth)
        if: ${{ github.event.inputs.operation == 'validate-auth' }}
        run: |
          echo "🔍 Testando acesso de leitura aos recursos Firebase..."

          # Tentar listar sites Hosting para confirmar acesso
          echo "📦 Consultando Firebase Hosting sites (read-only)..."

          # Capturar output e exit code sem falhar imediatamente
          set +e
          OUTPUT=$(npx firebase-tools hosting:sites:list --project "${{ env.PROJECT_ID_NORMALIZED }}" 2>&1)
          EXIT_CODE=$?
          set -e

          # Analisar resultado
          if [ $EXIT_CODE -eq 0 ]; then
            # Sucesso: EXIT_CODE 0 = AUTH_OK
            echo "✅ Acesso Firebase Hosting confirmado [AUTH_OK]"
          else
            # Erro: verificar padrões específicos

            # Padrões de erro que indicam falha de autenticação/autorização
            if echo "$OUTPUT" | grep -qi "permission denied\|insufficient permissions\|unauthorized\|unauthenticated\|authentication\|forbidden\|401\|403\|credentials\|permission"; then
              echo "❌ BLOQUEADO [AUTH_FAILED_OR_FORBIDDEN]"
              echo "Erro de autenticação ou autorização detectado!"
              exit 1
            fi

            # Padrões que indicam recurso não configurado (sem falha de auth)
            if echo "$OUTPUT" | grep -qi "not found\|does not exist\|no sites\|not configured\|not enabled"; then
              echo "⚠️  [AUTH_OK_RESOURCE_NOT_CONFIGURED]"
              echo "Firebase Hosting pode não estar configurado neste projeto"
              echo "Mas a autenticação foi bem-sucedida (serviço respondeu)"
            else
              # Erro desconhecido = FAIL-CLOSED obrigatório
              echo "❌ BLOQUEADO [VALIDATION_FAILED_UNKNOWN_ERROR]"
              echo "Comando retornou exit code $EXIT_CODE"
              echo "Erro não identificado como autenticação ou recurso ausente"
              exit 1
            fi
          fi

          echo "✅ Validação de autenticação concluída"

      - name: 🔧 Instalar dependências
        if: ${{ github.event.inputs.operation == 'deploy' }}
        working-directory: ./precocerto
        run: npm ci --legacy-peer-deps

      - name: 🏗️ Build da aplicação
        if: ${{ github.event.inputs.operation == 'deploy' }}
        working-directory: ./precocerto
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ env.PROJECT_ID_NORMALIZED }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_APP_ENV: staging
        run: npm run build

      - name: 🚀 Deploy para Firebase Hosting (Staging)
        if: ${{ github.event.inputs.operation == 'deploy' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}'
          projectId: ${{ steps.firebase-config.outputs.project_id }}
          channelId: live
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: ✅ Deploy para Staging concluído!
        if: ${{ github.event.inputs.operation == 'deploy' }}
        run: |
          echo "🎉 Aplicação deployada em https://${{ steps.firebase-config.outputs.project_id }}.web.app"
          echo "📝 Verificar logs em: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "🔐 Ambiente: staging"
          echo "🏷️ Project ID: ${{ steps.firebase-config.outputs.project_id }}"
          echo "🔑 Credencial: FIREBASE_SERVICE_ACCOUNT_STAGING"

      - name: ✅ Validação de Autenticação Completa (validate-auth)
        if: ${{ github.event.inputs.operation == 'validate-auth' }}
        run: |
          echo "🎉 Validação de autenticação Firebase Staging concluída com sucesso!"
          echo "📋 Resumo:"
          echo "   ✅ Credencial FIREBASE_SERVICE_ACCOUNT_STAGING ativa"
          echo "   ✅ Identidade: github-actions-staging@precocerto-staging.iam.gserviceaccount.com"
          echo "   ✅ Projeto: ${{ env.PROJECT_ID_NORMALIZED }}"
          echo "   ✅ Proteção de produção: ativa"
          echo "   ✅ Acesso Firebase validado (read-only)"
          echo ""
          echo "⚡ Próximo passo: Executar com operation=deploy para publicar"

      - name: ✅ Deploy Firestore Rules Concluído (deploy-rules)
        if: ${{ github.event.inputs.operation == 'deploy-rules' }}
        run: |
          echo "🎉 Firestore Rules publicadas exclusivamente em precocerto-staging!"
          echo "📋 Resumo:"
          echo "   ✅ Firestore Rules (precocerto/firestore.rules) publicadas"
          echo "   ✅ Projeto: ${{ env.PROJECT_ID_NORMALIZED }}"
          echo "   ✅ Credencial: FIREBASE_SERVICE_ACCOUNT_STAGING"
          echo "   🔒 Isolamento: Somente Rules (sem indexes, hosting, functions)"
          echo "   ✅ Proteção de produção: ativa"
          echo ""
          echo "📊 Resultado: Firestore Rules em staging atualizadas com sucesso"
          echo "📝 Verificar logs em: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: 🔐 Validar Project ID (smoke-rules)
        if: ${{ github.event.inputs.operation == 'smoke-rules' }}
        run: |
          PROJECT_ID_RAW="${{ vars.FIREBASE_PROJECT_ID }}"
          PROJECT_ID_NORMALIZED=$(printf '%s' "$PROJECT_ID_RAW" | tr '[:upper:]' '[:lower:]' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          if [ "$PROJECT_ID_NORMALIZED" = "precocerto-cc04a" ]; then
            echo "❌ BLOQUEADO: Detectado Project ID de PRODUÇÃO!"
            exit 1
          fi

          if [ "$PROJECT_ID_NORMALIZED" != "precocerto-staging" ]; then
            echo "❌ BLOQUEADO: Project ID inválido para smoke-rules!"
            exit 1
          fi

          echo "PROJECT_ID_NORMALIZED=$PROJECT_ID_NORMALIZED" >> $GITHUB_ENV
          echo "✅ Project ID validado: $PROJECT_ID_NORMALIZED"

      - name: 📦 Setup Node.js (smoke-rules)
        if: ${{ github.event.inputs.operation == 'smoke-rules' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📥 Instalar dependências (smoke-rules)
        if: ${{ github.event.inputs.operation == 'smoke-rules' }}
        working-directory: ./precocerto
        run: npm ci --legacy-peer-deps

      - name: 🧪 Executar Smoke Tests das Firestore Rules (smoke-rules)
        if: ${{ github.event.inputs.operation == 'smoke-rules' }}
        working-directory: ./precocerto
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ env.PROJECT_ID_NORMALIZED }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          STG_SMOKE_ADMIN_EMAIL: ${{ secrets.STG_SMOKE_ADMIN_EMAIL }}
          STG_SMOKE_ADMIN_PASSWORD: ${{ secrets.STG_SMOKE_ADMIN_PASSWORD }}
          STG_SMOKE_MANAGER_A_EMAIL: ${{ secrets.STG_SMOKE_MANAGER_A_EMAIL }}
          STG_SMOKE_MANAGER_A_PASSWORD: ${{ secrets.STG_SMOKE_MANAGER_A_PASSWORD }}
          STG_SMOKE_FUNC_A_EMAIL: ${{ secrets.STG_SMOKE_FUNC_A_EMAIL }}
          STG_SMOKE_FUNC_A_PASSWORD: ${{ secrets.STG_SMOKE_FUNC_A_PASSWORD }}
          STG_SMOKE_FUNC_A2_EMAIL: ${{ secrets.STG_SMOKE_FUNC_A2_EMAIL }}
          STG_SMOKE_FUNC_A2_PASSWORD: ${{ secrets.STG_SMOKE_FUNC_A2_PASSWORD }}
          STG_SMOKE_FUNC_B_EMAIL: ${{ secrets.STG_SMOKE_FUNC_B_EMAIL }}
          STG_SMOKE_FUNC_B_PASSWORD: ${{ secrets.STG_SMOKE_FUNC_B_PASSWORD }}
          STG_SMOKE_DEACTIVATED_EMAIL: ${{ secrets.STG_SMOKE_DEACTIVATED_EMAIL }}
          STG_SMOKE_DEACTIVATED_PASSWORD: ${{ secrets.STG_SMOKE_DEACTIVATED_PASSWORD }}
        run: |
          echo "🔥 Smoke Tests STG-01.4..."
          echo ""
          node scripts/staging-firestore-smoke.mjs
          SMOKE_EXIT_CODE=$?

          if [ $SMOKE_EXIT_CODE -eq 0 ]; then
            echo ""
            echo "✅ Smoke Tests PASS"
          else
            echo ""
            echo "❌ Smoke Tests FAIL (exit code: $SMOKE_EXIT_CODE)"
            exit $SMOKE_EXIT_CODE
          fi

      - name: ✅ Smoke Tests Concluído (smoke-rules)
        if: ${{ github.event.inputs.operation == 'smoke-rules' }}
        run: |
          echo "🎉 Smoke Tests das Firestore Rules concluído com sucesso!"
          echo "📋 Resumo:"
          echo "   ✅ Firebase Client SDK autenticado"
          echo "   ✅ 6 identities testadas"
          echo "   ✅ 15 testes executados (6 positivos + 9 negativos)"
          echo "   ✅ Projeto: ${{ env.PROJECT_ID_NORMALIZED }}"
          echo "   ✅ Proteção de produção: ativa"
          echo ""
          echo "📊 Resultado: Firestore Rules validadas em staging"
          echo "📝 Verificar logs em: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
