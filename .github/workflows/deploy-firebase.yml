name: 🚀 Deploy para Firebase Hosting

on:
  workflow_dispatch:
    inputs:
      confirm_project_id:
        description: 'Digite precocerto-cc04a para confirmar deploy em PRODUÇÃO'
        required: true
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 🔐 Confirmar destino de PRODUÇÃO
        shell: bash
        run: |
          EXPECTED_PROJECT="precocerto-cc04a"
          RECEIVED_PROJECT="${{ github.event.inputs.confirm_project_id }}"
          if [ "$RECEIVED_PROJECT" != "$EXPECTED_PROJECT" ]; then
            echo "❌ BLOQUEADO: confirmação de produção inválida."
            echo "   Esperado: $EXPECTED_PROJECT"
            echo "   Recebido: $RECEIVED_PROJECT"
            exit 1
          fi
          echo "✅ Confirmação explícita de produção recebida."

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🔧 Instalar dependências
        working-directory: ./precocerto
        run: npm ci

      - name: 🏗️ Build da aplicação
        working-directory: ./precocerto
        run: npm run build

      - name: 🚀 Deploy para Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRECOCERTO }}'
          projectId: precocerto-cc04a
          channelId: live
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: ✅ Deploy concluído com sucesso!
        run: |
          echo "🎉 Aplicação deployada em https://precocerto-cc04a.web.app"
          echo "📝 Verificar logs em: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
